<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรแกรมจัดตารางเวร</title>
  <style>
    /* สามารถใส่ CSS เดิมของคุณตรงนี้ได้ */
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    button { padding: 8px 15px; cursor: pointer; margin-right: 5px; }
    .btn-save { background-color: #4CAF50; color: white; border: none; }
    .btn-generate { background-color: #2196F3; color: white; border: none; }
    .alert-success { color: green; font-weight: bold; display: none; margin-left: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>โปรแกรมจัดตารางเวร</h1>
    <div>แก้สมาชิก จำนวนเวร วันหยุด และเงื่อนไข แล้วกด “สร้างตาราง”</div>
  </header>

  <main>
    <!-- แถบปุ่มควบคุม และปุ่มบันทึกข้อมูล -->
    <div class="section">
      <button type="button" class="btn-save" onclick="saveData()">💾 บันทึกข้อมูล</button>
      <button type="button" class="btn-generate" onclick="generateSchedule()">🎲 สร้างตาราง</button>
      <span id="saveAlert" class="alert-success">บันทึกข้อมูลเรียบร้อยแล้ว!</span>
    </div>

    <!-- ส่วนตั้งค่าสมาชิก -->
    <div class="section">
      <h2>สมาชิกและจำนวนเวร</h2>
      <textarea id="membersInput" rows="5" style="width: 100%;" placeholder="กรอกรายชื่อสมาชิก..."></textarea>
    </div>

    <!-- ส่วนตั้งค่าวันหยุดราชการ -->
    <div class="section">
      <h2>วันหยุดราชการ</h2>
      <textarea id="holidaysInput" rows="3" style="width: 100%;" placeholder="กรอกวันหยุดราชการ..."></textarea>
    </div>

    <!-- ส่วนเงื่อนไขสมาชิกที่ไม่สามารถอยู่เวรได้ -->
    <div class="section">
      <h2>สมาชิกที่ไม่สามารถอยู่เวรในวันนั้นได้</h2>
      <p>เลือกวันที่ แล้วติ๊กชื่อสมาชิกที่ <b>ห้ามจัดเวรในวันนั้น</b></p>
      <textarea id="offDaysInput" rows="3" style="width: 100%;" placeholder="กรอกเงื่อนไขวันห้ามอยู่เวร..."></textarea>
    </div>

    <!-- ส่วนตารางปฏิทินและสรุปผล -->
    <div class="section">
      <h2>ตารางปฏิทิน</h2>
      <div id="calendarDisplay"></div>
    </div>

    <div class="section">
      <h2>สรุปจำนวนเวร</h2>
      <div id="summaryDisplay"></div>
    </div>
  </main>

  <script>
    // 1. ฟังก์ชันโหลดข้อมูลที่เคยบันทึกไว้ออกจาก localStorage เมื่อเปิดหน้าเว็บ
    window.onload = function() {
      loadSavedData();
    };

    // 2. ฟังก์ชันบันทึกข้อมูลลง localStorage
    function saveData() {
      const membersData = document.getElementById('membersInput').value;
      const holidaysData = document.getElementById('holidaysInput').value;
      const offDaysData = document.getElementById('offDaysInput').value;

      // สร้าง Object เก็บข้อมูล
      const scheduleConfig = {
        members: membersData,
        holidays: holidaysData,
        offDays: offDaysData
      };

      // แปลงเป็น JSON string แล้วบันทึกเข้า localStorage
      localStorage.setItem('myShiftScheduleData', JSON.stringify(scheduleConfig));

      // แสดงข้อความแจ้งเตือนเมื่อบันทึกสำเร็จ
      const alertBox = document.getElementById('saveAlert');
      alertBox.style.display = 'inline';
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 2500);
    }

    // 3. ฟังก์ชันดึงข้อมูลเดิมกลับมาใส่ในช่องกรอกข้อมูล
    function loadSavedData() {
      const savedData = localStorage.getItem('myShiftScheduleData');
      if (savedData) {
        const config = JSON.parse(savedData);
        if (config.members) document.getElementById('membersInput').value = config.members;
        if (config.holidays) document.getElementById('holidaysInput').value = config.holidays;
        if (config.offDays) document.getElementById('offDaysInput').value = config.offDays;
      }
    }

    // 4. ฟังก์ชันสร้างตารางเวร (ใส่ Logic เดิมของคุณตรงนี้)
    function generateSchedule() {
      // เรียกฟังก์ชันบันทึกข้อมูลให้อัตโนมัติทุกครั้งที่กดสร้างตาราง (Optional)
      saveData();

      // --- นำ Logic จัดตารางเวรเดิมของคุณมาใส่ตรงนี้ ---
      console.log("กำลังสร้างตารางเวร...");
    }
  </script>
</body>
</html>
